name: Trusted release
on:
  workflow_dispatch:
permissions: {}
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Select project-owned image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke-test before publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: secure-release-pipeline:release
          build-args: APP_VERSION=${{ github.sha }}
      - env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: scripts/smoke-container.sh secure-release-pipeline:release "$EXPECTED_VERSION"
      - name: Publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Attest the exact published digest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify provenance and published container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main \
            --source-digest "$EXPECTED_VERSION" \
            --deny-self-hosted-runners > provenance-verification.json
          docker pull "${IMAGE}@${DIGEST}"
          scripts/smoke-container.sh "${IMAGE}@${DIGEST}" "$EXPECTED_VERSION"
          {
            echo '### Verified release'
            echo "Image: \`${IMAGE}@${DIGEST}\`"
            echo "Source commit: \`${EXPECTED_VERSION}\`"
            echo 'Workflow: `.github/workflows/release.yml` on `refs/heads/main`'
          } >> "$GITHUB_STEP_SUMMARY"
