apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: trusted-release
spec:
  images:
    - glob: "ghcr.io/arhumamjad07/secure-release-pipeline**"
  authorities:
    - name: github-release
      signatureFormat: bundle
      keyless:
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/arhumamjad07/secure-release-pipeline/.github/workflows/release.yml@refs/heads/main
      attestations:
        - name: release-provenance
          predicateType: https://slsa.dev/provenance/v1
          policy:
            type: cue
            data: |
              predicateType: "https://slsa.dev/provenance/v1"
              predicate: buildDefinition: externalParameters: workflow: {
                repository: "https://github.com/arhumamjad07/secure-release-pipeline"
                path: ".github/workflows/release.yml"
                ref: "refs/heads/main"
              }
